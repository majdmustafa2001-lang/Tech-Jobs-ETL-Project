name: Repository CI

on:
  push:
    branches:
      - New_Source_Integration
      - main
  pull_request:
    branches:
      - main
      - New_Source_Integration

permissions:
  contents: read

jobs:
  offline-validation:
    name: Validate project source files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install "PyYAML>=6,<7"

      - name: Run repository contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
